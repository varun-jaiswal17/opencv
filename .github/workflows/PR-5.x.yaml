name: PR:5.x

on:
  pull_request:
    branches:
      - 5.x

jobs:
  # --- PRIORITY LANE: the labeled platform's primary job runs first (added) ---
  priority-Windows:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'priority:windows') }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-Windows.yaml@main
    with:
      workflow_branch: main

  priority-Linux:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'priority:linux') }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-Linux.yaml@main
    with:
      workflow_branch: 'main'

  priority-ARM64:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'priority:ARM') }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-ARM64.yaml@main

  priority-macOS-ARM64:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'priority:mac') }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-macOS-ARM64.yaml@main

  # --- BARRIER: releases the rest once the priority lane finishes (added) ---
  priority-gate:
    needs: [priority-Windows, priority-Linux, priority-ARM64, priority-macOS-ARM64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Priority phase complete - releasing the rest of the flow."

  # --- Linux Group 1: Core Ubuntu (U26/U24/U22/U20 matrix) ---
  Linux:
    needs: priority-gate
    if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'priority:linux') }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-Linux.yaml@main
    with:
      workflow_branch: 'main'

  # --- Linux Group 2: Validation (OpenVINO → No-HAL, sequential on same runner) ---
  Ubuntu2004-x64-OpenVINO:
    needs: priority-gate
    if: ${{ !cancelled() }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-U20-OpenVINO.yaml@main

  Linux-no-HAL:
    needs: Ubuntu2004-x64-OpenVINO
    if: ${{ !cancelled() }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-Linux-NoHAL.yaml@main

  # --- Linux Group 3: Extended (CUDA → Alpine, sequential on same runner) ---
  Ubuntu2004-x64-CUDA:
    needs: priority-gate
    if: "${{ contains(github.event.pull_request.labels.*.name, 'category: dnn') }} || ${{ contains(github.event.pull_request.labels.*.name, 'category: dnn (onnx)') }}"
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-U20-Cuda.yaml@main

  Linux-Apline:
    needs: Ubuntu2004-x64-CUDA
    if: ${{ !cancelled() }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-Linux-Alpine.yaml@main

  Windows:
    needs: priority-gate
    if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'priority:windows') }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-Windows.yaml@main
    with:
      workflow_branch: main

  Ubuntu2404-ARM64:
    needs: priority-gate
    if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'priority:ARM') }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-ARM64.yaml@main

  Ubuntu2404-ARM64-Debug:
    needs: priority-gate
    if: ${{ !cancelled() }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-ARM64-Debug.yaml@main

# Vulkan configuration disabled as Vulkan backend for DNN does not support int/int64 for now
# Details: https://github.com/opencv/opencv/issues/25110
#  Windows10-x64-Vulkan:
#    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-W10-Vulkan.yaml@main

  macOS-ARM64:
    needs: priority-gate
    if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'priority:mac') }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-macOS-ARM64.yaml@main

#  macOS-ARM64-Vulkan:
#    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-macOS-ARM64-Vulkan.yaml@main

  macOS-x64:
    needs: priority-gate
    if: ${{ !cancelled() }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-macOS-x86_64.yaml@main

  iOS:
    needs: priority-gate
    if: ${{ !cancelled() }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-iOS.yaml@main

  Android:
    needs: priority-gate
    if: ${{ !cancelled() }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-Android.yaml@main

  docs:
    needs: priority-gate
    if: ${{ !cancelled() }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-docs.yaml@main

  Linux-RISC-V-Clang:
    needs: priority-gate
    if: ${{ !cancelled() }}
    uses: opencv/ci-gha-workflow/.github/workflows/OCV-PR-5.x-RISCV.yaml@main
